name: Build FromTheHorror (Fabric 1.20.1)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"
      - "FromTheHorror (1).zip"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract source archive
        shell: bash
        run: |
          mkdir -p extracted
          unzip -q "FromTheHorror (1).zip" -d extracted
          echo "Archive contents:"
          find extracted -maxdepth 4 -type f | sort | head -200
          PROJECT_DIR="$(find extracted -type f \\( -name gradlew -o -name build.gradle -o -name build.gradle.kts \\) -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::No Gradle build file or gradlew was found inside the ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project directory: $PROJECT_DIR"

      - name: Set up Gradle (fallback when wrapper is absent)
        if: ${{ hashFiles('extracted/**/gradlew') == '' }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Build mod
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew clean build --no-daemon
          else
            gradle clean build --no-daemon
          fi

      - name: Upload built JARs
        uses: actions/upload-artifact@v4
        with:
          name: FromTheHorror-Fabric-1.20.1
          path: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

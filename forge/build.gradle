plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = 'com.vivian'
version = mod_version
base { archivesName = 'Vivian-Forge-1.20.1' }

java { toolchain.languageVersion = JavaLanguageVersion.of(17) }

minecraft {
    mappings channel: 'official', version: minecraft_version
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods { vivian { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods { vivian { source sourceSets.main } }
        }
    }
}

repositories { mavenCentral() }
dependencies { minecraft "net.minecraftforge:forge:\${minecraft_version}-\${forge_version}" }

sourceSets.main.resources { srcDir '../src/main/resources' }
processResources {
    exclude 'fabric.mod.json'
    exclude 'vivian.mixins.json'
    filesMatching('META-INF/mods.toml') {
        expand mod_id: mod_id, mod_name: mod_name, mod_version: mod_version, minecraft_version: minecraft_version, forge_version: forge_version
    }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

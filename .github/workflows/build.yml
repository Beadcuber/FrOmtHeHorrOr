name: Build Vivian (Fabric 1.20.1)
# Full Vivian-only cleanup, identity migration and gameplay verification

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"
      - "FromTheHorror (1).zip"
      - "mod_patch.py"
      - "finish_mobs.py"
      - "fix_mobs_patch.py"
      - "finish_ai.py"
      - "cori_upgrade.py"
      - "cori_verify.py"
      - "carry_music.py"
      - "horror_upgrade.py"
      - "next_upgrade.py"
      - "final_fixes.py"
      - "voice_fix.py"
      - "feature_fix.py"
      - "requested_oct31.py"
      - "vivian_structures.py"
      - "vivian_final.py.gz.b64"
      - "decode_vivian_patch.py"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Extract source archive
        shell: bash
        run: |
          mkdir -p extracted
          unzip -q "FromTheHorror (1).zip" -d extracted
          PROJECT_FILE="$(find extracted -type f | grep -E '/(gradlew|build.gradle|build.gradle.kts)$' | head -n 1)"
          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::No Gradle build file or gradlew was found inside the ZIP."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project directory: $PROJECT_DIR"
      - name: Install audio encoder and texture tooling
        run: sudo apt-get update && sudo apt-get install -y ffmpeg python3-pil
      - name: Apply Vivian-only gameplay changes
        shell: bash
        run: |
          python3 mod_patch.py "$PROJECT_DIR"
          python3 fix_mobs_patch.py
          python3 finish_mobs.py "$PROJECT_DIR"
          cd "$PROJECT_DIR"
          python3 ../finish_ai.py
          python3 ../cori_upgrade.py
          python3 ../carry_music.py
          python3 ../horror_upgrade.py
          python3 ../final_fixes.py
          python3 ../voice_fix.py
          python3 ../feature_fix.py .
          python3 ../requested_oct31.py
          python3 ../vivian_structures.py
          python3 ../decode_vivian_patch.py ../vivian_final.py.gz.b64 ../vivian_final.py
          python3 ../vivian_final.py
          python3 ../cori_verify.py
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"
      - name: Build Vivian mod
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew clean build --no-daemon
          else
            gradle clean build --no-daemon
          fi
          python3 ../cori_verify.py --jar "$(find build/libs -name '*.jar' | head -n 1)"
      - name: Upload Vivian JARs
        uses: actions/upload-artifact@v4
        with:
          name: Vivian-Fabric-1.20.1
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
      - name: Upload editable Vivian source
        uses: actions/upload-artifact@v4
        with:
          name: Vivian-source
          path: ${{ env.PROJECT_DIR }}/
          if-no-files-found: error
          retention-days: 14

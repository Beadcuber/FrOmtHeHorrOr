name: Build FromTheHorror (Fabric 1.20.1)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"
      - "FromTheHorror (1).zip"
      - "mod_patch.py"
      - "finish_mobs.py"
      - "fix_mobs_patch.py"
      - "finish_ai.py"
      - "cori_upgrade.py"
      - "cori_verify.py"
      - "carry_music.py"
      - "horror_upgrade.py"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract source archive
        shell: bash
        run: |
          mkdir -p extracted
          unzip -q "FromTheHorror (1).zip" -d extracted
          echo "Archive contents:"
          find extracted -maxdepth 4 -type f | sort | head -200
          PROJECT_FILE="$(find extracted -type f | grep -E '/(gradlew|build.gradle|build.gradle.kts)$' | head -n 1)"
          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::No Gradle build file or gradlew was found inside the ZIP."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project directory: $PROJECT_DIR"

      - name: Install audio encoder
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Apply requested gameplay changes
        shell: bash
        run: |
          python3 mod_patch.py "$PROJECT_DIR"
          python3 fix_mobs_patch.py
          python3 finish_mobs.py "$PROJECT_DIR"
          cd "$PROJECT_DIR"
          python3 ../finish_ai.py
          python3 ../cori_upgrade.py
          python3 ../carry_music.py
          python3 ../horror_upgrade.py
          python3 ../cori_verify.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Build mod
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew clean build --no-daemon
          else
            gradle clean build --no-daemon
          fi
          python3 ../cori_verify.py --jar "$(find build/libs -name '*.jar' | head -n 1)"

      - name: Upload built JARs
        uses: actions/upload-artifact@v4
        with:
          name: FromTheHorror-Fabric-1.20.1
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload editable source
        uses: actions/upload-artifact@v4
        with:
          name: FromTheHorror-source
          path: ${{ env.PROJECT_DIR }}/
          if-no-files-found: error
          retention-days: 14
